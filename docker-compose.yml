version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: migration_qdrant
    ports:
      - "6333:6333" # REST API & Dashboard Dashboard UI
      - "6334:6334" # gRPC API
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  qdrant_storage:
    driver: local